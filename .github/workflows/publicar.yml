# En cada cambio en main: pasa todas las pruebas y, si van bien, publica la app en GitHub Pages.
# En GitHub: Settings → Pages → Source: "GitHub Actions".
name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruebas:
    # Imagen fija: «ubuntu-latest» pasa a Ubuntu 26 desde octubre de 2026 y puede cambiar la ruta de Chrome o las fuentes
    runs-on: ubuntu-24.04
    env:
      # En hora de España, como los móviles de los atletas y la base («Europe/Madrid»): en UTC, de 0:00 a 1:00 (o 2:00 en
      # verano) las pruebas y la base estaban en días distintos y fallaban las que dependen de «hoy»
      TZ: Europe/Madrid
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lógica, permisos (RLS), capa de datos, demo y envío de notificaciones
        run: npm test
      - name: Empaquetar
        run: npm run build
      # (v0.207) la app empaquetada, para los cuatro trozos de la prueba de punta a punta
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  # (v0.207) La prueba de punta a punta, en cuatro trozos a la vez (de unos 75 minutos a unos 25). El trozo 1 lleva el flujo
  # principal; las demás partes se reparten entre los otros tres (test/e2e.test.mjs, FBE_TROZO). Si alguna parte falla, se
  # repite sola una vez; si pasa a la segunda, cuenta como «suelta» (un aviso en el resumen, sin parar la publicación).
  e2e:
    needs: pruebas
    runs-on: ubuntu-24.04
    # Lo normal son unos 22 minutos (el doble si un trozo se repite entero): con tope, una máquina atascada no ocupa 6 horas
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        trozo: [1, 2, 3, 4]
    env:
      TZ: Europe/Madrid
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Prueba de punta a punta en Chrome (trozo ${{ matrix.trozo }} de 4)
        shell: bash
        env:
          FBE_TROZO: ${{ matrix.trozo }}/4
        # Si falla, las últimas líneas salen como anotación en el resumen de la ejecución (sin abrir el registro completo)
        run: |
          set -o pipefail
          anotar() { grep -v '  ✓' "$1" | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          if FBE_INFORME=e2e-partes.json npm run e2e 2>&1 | tee e2e.log; then exit 0; fi
          # Si se quedó colgada (el vigía de e2e.test.mjs la corta a los 8 minutos sin una comprobación), lo que venía
          # detrás no ha llegado a pasar: se repite el trozo entero una vez
          colgada=$(node -e "try { const c = require('./e2e-partes.json').colgada; console.log(c == null ? '' : c) } catch {}")
          if [ -n "$colgada" ]; then
            echo "Se quedó colgada en la parte $colgada: se repite el trozo entero una vez"
            if FBE_INFORME=e2e-partes-2.json npm run e2e 2>&1 | tee e2e-2.log; then
              echo "::warning title=Prueba colgada (trozo ${{ matrix.trozo }})::Se quedó colgada en la parte $colgada a la primera y pasó entera a la segunda: $(grep -A6 'COLGADA' e2e.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
              exit 0
            fi
            echo "::error title=Prueba de punta a punta (trozo ${{ matrix.trozo }})::$(anotar e2e-2.log)"
            exit 1
          fi
          fallidas=$(node -e "try { console.log(require('./e2e-partes.json').fallidas.join(',')) } catch {}")
          if [ -z "$fallidas" ]; then
            echo "::error title=Prueba de punta a punta (trozo ${{ matrix.trozo }})::$(anotar e2e.log)"
            exit 1
          fi
          echo "Se repiten una vez las partes que han fallado: $fallidas"
          if FBE_TROZO= FBE_PARTES="$fallidas" FBE_INFORME=e2e-partes-2.json npm run e2e 2>&1 | tee e2e-2.log; then
            nombres=$(node -e "console.log(require('./e2e-partes.json').nombres.join(' | '))")
            echo "::warning title=Pruebas sueltas (trozo ${{ matrix.trozo }})::Fallaron a la primera y pasaron a la segunda: $nombres"
            exit 0
          fi
          echo "::error title=Prueba de punta a punta (trozo ${{ matrix.trozo }})::$(anotar e2e-2.log)"
          exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-trozo-${{ matrix.trozo }}
          path: |
            e2e*.log
            e2e-partes*.json
            test/e2e-fallo*.png
          retention-days: 7

  publicar:
    needs: [pruebas, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
