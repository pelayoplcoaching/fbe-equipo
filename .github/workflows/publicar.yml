# En cada cambio en main: pasa todas las pruebas y, si van bien, publica la app en GitHub Pages.
# En GitHub: Settings → Pages → Source: "GitHub Actions".
name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruebas:
    # Imagen fija: «ubuntu-latest» pasa a Ubuntu 26 desde octubre de 2026 y puede cambiar la ruta de Chrome o las fuentes
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lógica, permisos (RLS), capa de datos, demo y envío de notificaciones
        run: npm test
      - name: Empaquetar
        run: npm run build
      - name: Prueba de punta a punta en Chrome
        shell: bash
        # Si falla, las últimas líneas salen como anotación en el resumen de la ejecución (sin abrir el registro completo)
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log || {
            echo "::error title=Prueba de punta a punta::$(grep -v '  ✓' e2e.log | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          }
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  publicar:
    needs: pruebas
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
